---
name: CI

variables:
  defaults: &defaults
    runs-on: ["rouge-feline", "small", "debian-13-x86_64"]
    container:
      image: codeberg.org/rouge-ruby/ci-runner:5.1.0

  # note: this is accessed by ci/Makefile, do not move
  ruby-versions: &ruby-versions
    - "3.0"
    - "3.1"
    - "3.2"
    - "3.3"
    - "3.4"
    # the last version listed here will be used by default
    - "4.0"

on:
  push:
    # The `github-workflow-test` can be used to test changes without making a PR
    branches: [main, workflow-test]
  pull_request:
    branches: [main]

jobs:
  # linelint:
  #   name: Linelint
  #   <<: *defaults
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: fernandrone/linelint@master

  rubocop:
    name: RuboCop
    <<: *defaults
    steps:
      - uses: actions/checkout@v6
      - name: Install Gems
        run: bundle exec ruby --version && bundle install
      - name: Run RuboCop
        run: bundle exec ruby --version && bundle exec rake check:style

  test:
    name: Test ${{ matrix.ruby-version }}
    <<: *defaults
    strategy:
      matrix:
        ruby-version: *ruby-versions
    steps:
      - uses: actions/checkout@v6
      - name: Select Ruby
        run: /opt/rubies/${{ matrix.ruby-version }}/activate && ruby --version
      - name: Install Gems
        run: bundle exec ruby --version && bundle install
      - name: Run tests
        run: bundle exec ruby --version && bundle exec rake check:specs

  profile:
    name: Profile
    <<: *defaults
    steps:
      - uses: actions/checkout@v6
      - name: Install Gems
        run: bundle exec ruby --version && bundle install
      - name: Profile Memory Allocation
        run: bundle exec ruby --version && bundle exec rake check:memory
      - name: Interpreter Warnings Test
        env:
          RUBYOPT: "-w"
        run: bundle exec ruby --version && bundle exec rake check:specs
